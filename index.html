<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير المتابعة اليومي</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --main:#0f2a44;
  --accent:#1f6fd8;
  --success:#1bbf7a;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f2a44,#1f6fd8,#0b1c2d);
  font-family:"Segoe UI",Tahoma;
  color:#fff;
}

/* ===== HEADER ===== */
.header{
  background:rgba(15,42,68,.88);
  backdrop-filter:blur(14px);
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  padding:22px;
  border-radius:22px;
  margin:20px;
}
.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.logo-wrap{
  width:85px;height:85px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
}
.logo-wrap img{width:55px;height:55px}

/* ===== CARD ===== */
.glass{
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.3);
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  border-radius:24px;
  padding:32px;
}

/* ===== SECTIONS ===== */
.section-title{
  font-weight:800;
  margin:30px 0 12px;
  border-right:5px solid var(--accent);
  padding-right:12px;
}

/* ===== PILLS ===== */
.check-group{display:flex;flex-wrap:wrap;gap:12px}
.check-pill input{display:none}
.check-pill label{
  padding:12px 22px;
  border-radius:30px;
  background:#fff;
  color:#0f2a44;
  cursor:pointer;
  font-weight:700;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  transition:.25s;
}
.check-pill input:checked + label{
  background:linear-gradient(135deg,var(--accent),#4fa3ff);
  color:#fff;
  box-shadow:0 10px 25px rgba(31,111,216,.55);
}

/* ===== FORM ===== */
.form-control,.form-select{border-radius:14px;font-weight:600}
.btn-main{
  background:linear-gradient(135deg,var(--success),#14a36b);
  color:#fff;
  font-weight:800;
  border-radius:18px;
  padding:16px;
  border:none;
  box-shadow:0 12px 30px rgba(27,191,122,.55);
}
#msg{text-align:center;margin-top:18px;font-weight:700}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-content">
    <div class="logo-wrap">
      <img src="https://i.postimg.cc/FzzgM4GR/Screenshot-2024-09-12-215154-removebg-preview.png">
    </div>
    <div>
      <h2 class="m-0 fw-bold">تقرير المتابعة اليومي</h2>
      <small>شركة أون تايم للخدمات اللوجستية</small>
    </div>
  </div>
</div>

<!-- FORM -->
<div class="container my-5">
<div class="glass">
<form id="reportForm">

<div class="row mb-3">
  <div class="col-md-6 mb-3">
    <label class="form-label">التاريخ</label>
    <input type="date" id="date" class="form-control" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">الموظف</label>
    <select id="employee" class="form-select" required>
      <option value="">اختر الموظف</option>
      <option>زياد مصطفي</option>
      <option>فارس وليد</option>
      <option>منار محمد</option>
      <option>روضة احمد</option>
      <option>زياد السيد</option>
      <option>عبير منصور</option>
      <option>عبد العزيز عيسي</option>
      <option>محمد حسين</option>
      <option>منه منصور</option>
      <option>تسنيم محمد</option>
      <option>مهاب السيد</option>
    </select>
  </div>
</div>

<div class="section-title">التطبيق</div>
<div class="check-group" id="apps">
  <div class="check-pill"><input type="checkbox" id="a1" value="كيتا"><label for="a1">كيتا</label></div>
  <div class="check-pill"><input type="checkbox" id="a2" value="هنقرستيشن"><label for="a2">هنقرستيشن</label></div>
  <div class="check-pill"><input type="checkbox" id="a3" value="جاهز"><label for="a3">جاهز</label></div>
  <div class="check-pill"><input type="checkbox" id="a4" value="ذا شيفز"><label for="a4">ذا شيفز</label></div>
  <div class="check-pill"><input type="checkbox" id="a5" value="مرسول"><label for="a5">مرسول</label></div>
  <div class="check-pill"><input type="checkbox" id="a6" value="نون"><label for="a6">نون</label></div>
</div>

<div class="section-title">المدينة</div>
<div class="check-group" id="cities">
  <div class="check-pill"><input type="checkbox" id="c1" value="الرياض"><label for="c1">الرياض</label></div>
  <div class="check-pill"><input type="checkbox" id="c2" value="جدة"><label for="c2">جدة</label></div>
  <div class="check-pill"><input type="checkbox" id="c3" value="الدمام"><label for="c3">الدمام</label></div>
  <div class="check-pill"><input type="checkbox" id="c4" value="جميع المدن"><label for="c4">جميع المدن</label></div>
</div>

<div class="section-title">مواعيد الشيفت</div>
<div class="row mb-3">
  <div class="col"><input type="time" id="shift_from" class="form-control" required></div>
  <div class="col"><input type="time" id="shift_to" class="form-control" required></div>
</div>

<div class="section-title">المكالمات</div>
<div class="row mb-3">
  <div class="col"><input type="number" id="out_calls" class="form-control" placeholder="الصادرة" required></div>
  <div class="col"><input type="number" id="in_calls" class="form-control" placeholder="الواردة" required></div>
</div>

<div class="section-title">المهام المنجزة</div>
<textarea id="tasks" class="form-control mb-4" rows="4" required></textarea>

<button class="btn btn-main w-100">إرسال التقرير</button>
<div id="msg"></div>

</form>
</div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxnE76UN44BlYAx-bcFU8nJz38WOfErB-SkyIpVkTvYMXqXLeNb0nCOVzUTJl1wnTu8/exec";

const form = document.getElementById("reportForm");
const msg = document.getElementById("msg");
const date = document.getElementById("date");
const employee = document.getElementById("employee");
const shift_from = document.getElementById("shift_from");
const shift_to = document.getElementById("shift_to");
const out_calls = document.getElementById("out_calls");
const in_calls = document.getElementById("in_calls");
const tasks = document.getElementById("tasks");

date.valueAsDate = new Date();

function checkedValues(id){
  return [...document.querySelectorAll(`#${id} input:checked`)]
         .map(i=>i.value).join(" , ");
}

/* جميع المدن تلغي الباقي */
const cityInputs = document.querySelectorAll("#cities input");
const allCities = document.getElementById("c4");

cityInputs.forEach(cb=>{
  cb.addEventListener("change",()=>{
    if(cb === allCities && cb.checked){
      cityInputs.forEach(c=>{ if(c!==allCities) c.checked=false; });
    }
    if(cb !== allCities && cb.checked){
      allCities.checked=false;
    }
  });
});

form.addEventListener("submit",e=>{
  e.preventDefault();

  if(!checkedValues("apps") || !checkedValues("cities")){
    msg.innerText="⚠️ اختر تطبيق ومدينة";
    return;
  }

  fetch(scriptURL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      date: date.value,
      employee: employee.value,
      apps: checkedValues("apps"),
      cities: checkedValues("cities"),
      shift_from: shift_from.value,
      shift_to: shift_to.value,
      out_calls: out_calls.value,
      in_calls: in_calls.value,
      tasks: tasks.value
    })
  })
  .then(()=> {
    msg.innerText="✅ تم إرسال التقرير بنجاح";
    form.reset();
    date.valueAsDate=new Date();
  })
  .catch(()=> {
    msg.innerText="❌ فشل الإرسال";
  });
});
</script>

</body>
</html>
