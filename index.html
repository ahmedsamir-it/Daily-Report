<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير المتابعة اليومي</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  min-height:100vh;
  background: linear-gradient(135deg,#0f2a44,#1f6fd8,#0b1c2d);
  font-family:"Segoe UI",Tahoma;
  color:#fff;
}

.glass{
  background: rgba(255,255,255,.12);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,.3);
}

h1{
  font-weight:700;
}

.form-check-input:checked{
  background-color:#ffc107;
  border-color:#ffc107;
}

.btn-main{
  background: linear-gradient(135deg,#ffc107,#ff9800);
  color:#000;
  font-weight:700;
  border:none;
}

.btn-main:hover{
  opacity:.9;
}
</style>
</head>

<body>

<div class="container py-5">
  <div class="glass p-4 p-md-5">

    <h1 class="text-center mb-4">📊 تقرير المتابعة اليومي</h1>

    <!-- FORM -->
    <form id="reportForm">

      <div class="mb-3">
        <label class="form-label">اسم الموظف</label>
        <input type="text" class="form-control" id="employee" required>
      </div>

      <div class="mb-3">
        <label class="form-label">المدينة</label>
        <div class="row">

          <div class="col-6">
            <div class="form-check">
              <input class="form-check-input city" type="checkbox" value="الرياض">
              <label class="form-check-label">الرياض</label>
            </div>
            <div class="form-check">
              <input class="form-check-input city" type="checkbox" value="جدة">
              <label class="form-check-label">جدة</label>
            </div>
            <div class="form-check">
              <input class="form-check-input city" type="checkbox" value="الدمام">
              <label class="form-check-label">الدمام</label>
            </div>
          </div>

          <div class="col-6">
            <div class="form-check">
              <input class="form-check-input city" type="checkbox" value="المدينة">
              <label class="form-check-label">المدينة</label>
            </div>
            <div class="form-check">
              <input class="form-check-input city" type="checkbox" value="أبها">
              <label class="form-check-label">أبها</label>
            </div>
            <div class="form-check">
              <input class="form-check-input city" id="allCities" type="checkbox" value="جميع المدن">
              <label class="form-check-label fw-bold text-warning">جميع المدن</label>
            </div>
          </div>

        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">الملاحظات</label>
        <textarea class="form-control" id="notes" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-main w-100 py-2">
        🚀 إرسال التقرير
      </button>

      <div id="status" class="text-center mt-3"></div>

    </form>
  </div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxnE76UN44BlYAx-bcFU8nJz38WOfErB-SkyIpVkTvYMXqXLeNb0nCOVzUTJl1wnTu8/exec";

const form = document.getElementById("reportForm");
const statusDiv = document.getElementById("status");
const allCities = document.getElementById("allCities");
const cities = document.querySelectorAll(".city");

/* جميع المدن تلغي الباقي */
allCities.addEventListener("change", ()=>{
  cities.forEach(c => c.checked = false);
});

/* اختيار مدينة يلغي جميع المدن */
cities.forEach(c=>{
  c.addEventListener("change", ()=>{
    if(c.checked) allCities.checked = false;
  });
});

/* submit */
form.addEventListener("submit", e=>{
  e.preventDefault();

  const selectedCities = [];
  document.querySelectorAll("input[type=checkbox]:checked").forEach(c=>{
    selectedCities.push(c.value);
  });

  const data = new URLSearchParams({
    employee: document.getElementById("employee").value,
    city: selectedCities.join(", "),
    notes: document.getElementById("notes").value
  });

  statusDiv.innerHTML = "⏳ جاري الإرسال...";

  fetch(scriptURL,{
    method:"POST",
    body:data
  })
  .then(()=> statusDiv.innerHTML = "✅ تم الإرسال بنجاح")
  .catch(()=> statusDiv.innerHTML = "❌ فشل الإرسال");
});
</script>

</body>
</html>
